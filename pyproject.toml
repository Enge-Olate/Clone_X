[project]
name = "clone-x"
version = "0.1.0"
description = "Clone da rede social X"
authors = [
    {name = "olate",email = "100814308+Enge-Olate@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.15,<4"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "djangorestframework (>=3.18.3,<4.0.0)",
    "django-environ (>=0.14.0,<0.15.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)"
]
